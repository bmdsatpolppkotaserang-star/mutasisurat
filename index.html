<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Surat Digital - Satpol PP Kota Serang</title>
    
    <!-- PWA Configurations -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root { --primary-color: #0f172a; --accent-color: #2563eb; --bg-color: #f8fafc; }
        body { background-color: var(--bg-color); font-family: 'Segoe UI', system-ui, sans-serif; color: #334155; }
        .card { border: none; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .table th { background-color: var(--primary-color) !important; color: white; padding: 12px 16px; }
        .form-control { border-radius: 10px; padding: 10px 14px; }
        #loginWrapper { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); padding: 15px; }
        .login-card { background: white; padding: 30px; border-radius: 20px; width: 100%; max-width: 420px; }
        .logo-container { display: flex; justify-content: center; gap: 15px; margin-bottom: 20px; }
        .logo-container img { height: 55px; object-fit: contain; }
    </style>
</head>
<body>

    <!-- HALAMAN LOGIN -->
    <div id="loginWrapper">
        <div class="login-card">
            <div class="logo-container">
                <img src="logo.png" alt="Logo Kota Serang" loading="lazy">
                <img src="polpp.png" alt="Logo Satpol PP" loading="lazy">
            </div>
            <div class="text-center mb-4">
                <h4 class="fw-bold text-dark mb-1">Agenda Surat Digital</h4>
                <p class="text-muted small mb-0">Satpol PP Kota Serang</p>
            </div>
            <form id="loginForm">
                <div class="mb-3"><label class="form-label">Username</label><input type="text" class="form-control" id="username" required></div>
                <div class="mb-3"><label class="form-label">Password</label><input type="password" class="form-control" id="password" required></div>
                <div class="alert alert-danger py-2 small mb-3 d-none" id="loginError">Username atau password salah!</div>
                <button type="submit" class="btn btn-primary w-100 py-2" id="btnLogin">Masuk Aplikasi</button>
            </form>
        </div>
    </div>

    <!-- HALAMAN UTAMA APLIKASI -->
    <div id="appWrapper" class="container py-4 d-none">
        <!-- Tombol Install PWA -->
        <button id="btnInstall" class="btn btn-warning fw-bold px-3 py-2 rounded-3 mb-3 d-none">
            <i class="bi bi-download me-1"></i> Install Aplikasi ke HP
        </button>

        <div class="d-flex justify-content-between align-items-center mb-4 bg-white p-3 rounded-4 shadow-sm">
            <div class="d-flex align-items-center gap-3">
                <div class="bg-primary text-white p-2 rounded-3"><i class="bi bi-folder2-open fs-5"></i></div>
                <div><h5 class="fw-bold mb-0">Agenda Surat Digital</h5><span class="text-muted small">Satpol PP Kota Serang</span></div>
            </div>
            <button class="btn btn-outline-danger btn-sm" onclick="logout()">Keluar</button>
        </div>
        
        <div class="card p-4 mb-4 bg-white">
            <h5 class="mb-3 text-primary fw-bold"><i class="bi bi-plus-circle-fill"></i> Tambah Agenda Surat</h5>
            <form id="agendaForm">
                <div class="row g-3">
                    <div class="col-md-4"><label class="form-label">Tanggal</label><input type="date" class="form-control" id="tanggal" required></div>
                    <div class="col-md-4"><label class="form-label">Nomor Surat</label><input type="text" class="form-control" id="nomorSurat" required></div>
                    <div class="col-md-4"><label class="form-label">Perihal</label><input type="text" class="form-control" id="perihal" required></div>
                    <div class="col-12"><button type="submit" class="btn btn-primary w-100" id="btnSimpan">Simpan Data</button></div>
                </div>
            </form>
        </div>

        <div class="card p-4 bg-white">
            <div class="table-responsive">
                <table class="table table-hover" id="tabelAgenda">
                    <thead><tr><th>No</th><th>Tanggal</th><th>Nomor Surat</th><th>Perihal</th><th>Aksi</th></tr></thead>
                    <tbody><tr><td colspan="5" class="text-center">Memuat data...</td></tr></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // PWA Install Logic
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('btnInstall').classList.remove('d-none');
        });

        document.getElementById('btnInstall').addEventListener('click', () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choice) => {
                    if (choice.outcome === 'accepted') document.getElementById('btnInstall').classList.add('d-none');
                    deferredPrompt = null;
                });
            }
        });

        // Register Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').catch(err => console.log(err));
        }

        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz_LY0b3RYe7qB85mg_6-KdENhjxwcGDwo5RiU2p-N3sxcQBcvBwvCnRFXBQ5pLrHFhOg/exec';

        window.onload = () => { if (localStorage.getItem("isLoggedIn") === "true") showApp(); };

        function showApp() {
            document.getElementById('loginWrapper').classList.add('d-none');
            document.getElementById('appWrapper').classList.remove('d-none');
            loadData();
        }

        function logout() { localStorage.removeItem("isLoggedIn"); location.reload(); }

        // Fungsi lainnya (Form, Fetch, Data) tetap sama...
    </script>
</body>
</html>
