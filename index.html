<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Agenda Surat - Satpol PP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <h2 class="mb-4 text-center">📂 Agenda Surat Digital Satpol PP</h2>
        
        <!-- Form Input -->
        <div class="card shadow-sm p-4 mb-5">
            <h4 class="mb-3">Tambah Agenda Surat</h4>
            <form id="agendaForm">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">Tanggal</label>
                        <input type="date" class="form-control" id="tanggal" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Nomor Surat</label>
                        <input type="text" class="form-control" id="nomorSurat" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Perihal</label>
                        <input type="text" class="form-control" id="perihal" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Asal Surat</label>
                        <input type="text" class="form-control" id="asalSurat">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Uraian</label>
                        <input type="text" class="form-control" id="uraian">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Pengelola</label>
                        <input type="text" class="form-control" id="pengelola">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Tanggal Selesai</label>
                        <input type="date" class="form-control" id="tanggalSelesai">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Upload File Surat (PDF/Foto)</label>
                        <input type="file" class="form-control" id="fileSurat">
                    </div>
                    <div class="col-md-12">
                        <label class="form-label">Keterangan</label>
                        <textarea class="form-control" id="keterangan" rows="2"></textarea>
                    </div>
                    <div class="col-12">
                        <button type="submit" class="btn btn-primary" id="btnSimpan">Simpan Data</button>
                    </div>
                </div>
            </form>
        </div>

        <!-- Tabel Data -->
        <div class="card shadow-sm p-4">
            <h4 class="mb-3">Daftar Agenda Surat</h4>
            <div class="table-responsive">
                <table class="table table-bordered table-striped" id="tabelAgenda">
                    <thead class="table-dark">
                        <tr>
                            <th>No. Urut</th>
                            <th>Tanggal</th>
                            <th>Nomor Surat</th>
                            <th>Perihal</th>
                            <th>Asal Surat</th>
                            <th>Keterangan</th>
                            <th>File</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Data dimuat via JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz_LY0b3RYe7qB85mg_6-KdENhjxwcGDwo5RiU2p-N3sxcQBcvBwvCnRFXBQ5pLrHFhOg/exec';

        document.getElementById('agendaForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = document.getElementById('btnSimpan');
            btn.innerText = 'Menyimpan...';
            btn.disabled = true;

            const fileInput = document.getElementById('fileSurat');
            const file = fileInput.files[0];

            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    sendData(event.target.result, file.name, file.type);
                };
                reader.readAsDataURL(file);
            } else {
                sendData(null, null, null);
            }
        });

        function sendData(fileData, fileName, fileType) {
            const data = {
                tanggal: document.getElementById('tanggal').value,
                nomorSurat: document.getElementById('nomorSurat').value,
                perihal: document.getElementById('perihal').value,
                uraian: document.getElementById('uraian').value,
                asalSurat: document.getElementById('asalSurat').value,
                pengelola: document.getElementById('pengelola').value,
                tanggalSelesai: document.getElementById('tanggalSelesai').value,
                keterangan: document.getElementById('keterangan').value,
                fileData: fileData,
                fileName: fileName,
                fileType: fileType
            };

            fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify(data)
            })
            .then(res => res.json())
            .then(res => {
                alert(res.message);
                location.reload();
            })
            .catch(err => {
                alert('Gagal menyimpan data!');
                console.error(err);
                document.getElementById('btnSimpan').disabled = false;
                document.getElementById('btnSimpan').innerText = 'Simpan Data';
            });
        }

        // Load data saat halaman dibuka
        fetch(SCRIPT_URL)
        .then(res => res.json())
        .then(data => {
            const tbody = document.querySelector('#tabelAgenda tbody');
            tbody.innerHTML = '';
            data.forEach((row, index) => {
                let fileLink = row['Link File'] ? `<a href="${row['Link File']}" target="_blank">Lihat File</a>` : '-';
                let tr = `<tr>
                    <td>${index + 1}</td>
                    <td>${row['Tanggal'] ? row['Tanggal'].split('T')[0] : ''}</td>
                    <td>${row['Nomor Surat']}</td>
                    <td>${row['Perihal']}</td>
                    <td>${row['Asal Surat']}</td>
                    <td>${row['Keterangan']}</td>
                    <td>${fileLink}</td>
                </tr>`;
                tbody.innerHTML += tr;
            });
        });
    </script>
</body>
</html>
